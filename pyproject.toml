[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cova-tad"
version = "0.1.0"
description = "Training-free tabular anomaly detection from conditional predictive dispersion"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
  "tabicl==2.1.1",
  "torch>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7", "seaborn>=0.12"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["covatad*", "src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
